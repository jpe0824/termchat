# GoReleaser v2 (written against 2.20). Run `goreleaser check` after editing.
version: 2

project_name: termchat

before:
  hooks:
    - go mod tidy

builds:
  - id: termchat
    main: ./cmd/termchat
    binary: termchat
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/jpe0824/termchat/internal/cli.Version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: termchat
    ids: [termchat]
    formats: [tar.gz]
    name_template: "termchat_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs(\([[:word:]]+\))??:'
      - '^test(\([[:word:]]+\))??:'
      - '^chore(\([[:word:]]+\))??:'
      - '^ci(\([[:word:]]+\))??:'

# `brews` is deprecated since GoReleaser 2.10 in favour of `homebrew_casks`, but
# casks are macOS-only, have no `test` block and no license field. A formula
# installs on macOS and Linux and is tested with `brew test`.
#
# Publishing needs the HOMEBREW_TAP_GITHUB_TOKEN environment variable (a token
# with contents write on jpe0824/homebrew-tap). Without it the formula is still
# generated in dist/ but nothing is pushed.
brews:
  - name: termchat
    repository:
      owner: jpe0824
      name: homebrew-tap
      branch: main
      token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'
    directory: Formula
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/jpe0824/termchat
    description: Fast, reliable, chat-only TUI that runs in any terminal
    license: MIT
    test: |
      system "#{bin}/termchat", "--version"
